# Billing system: one workbook with a sales sheet and a purchase sheet (synthetic headers; replace them with the
# headers of the real export: docs/development.md). Each sheet's column header is on one row; the sheet is found by
# its headers (the sheet name does not matter). Amount in Rs is before GST: the export has no GST columns.
# Names (customer, vendor, handler, submitted by) are masked on load; there is no period header: the period is read
# from the invoice dates.
# How profiles work: src/fin/extract/profiles.py and docs/development.md.
kind = "registers"
header_rows = 1
date_format = "%d-%m-%Y"
unit = 1

[sales.columns]
"Bill Id" = "bill_id"
"Purchase Id" = "purchase_id"
"Customer Id" = "customer_id"
"Customer Name" = "customer"
"Location" = "location"
"Invoice No" = "invoice_no"
"Contract Start Date" = "contract_start"
"Contract End Date" = "contract_end"
"Invoice Date" = "invoice_date"
"Order Type" = "order_type"
"Product" = "product"
"Service Start Date" = "service_start"
"Service End Date" = "service_end"
"Quantity" = "quantity"
"Rate" = "rate"
"Amount" = "amount"
"Currency" = "currency"
"Currency Rate" = "currency_rate"
"Amount in Rs" = "amount_inr"
"Service Type" = "service_type"
"Handler" = "handler"
"Submitted By" = "submitted_by"

[purchase.columns]
"Purchase Id" = "purchase_id"
"Vendor Id" = "vendor_id"
"Vendor Name" = "vendor"
"Location" = "location"
"Invoice No" = "invoice_no"
"Invoice Date" = "invoice_date"
"Product" = "product"
"Quantity" = "quantity"
"Rate" = "rate"
"Amount" = "amount"
"Currency" = "currency"
"Currency Rate" = "currency_rate"
"Amount in Rs" = "amount_inr"
"Handler" = "handler"
"Submitted By" = "submitted_by"

[rows]
skip = ["Total", "Grand Total"]
