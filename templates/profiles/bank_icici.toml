# ICICI Bank current account statement (Excel, or a PDF read by the chosen PDF add-on), INR or USD account.
# Header lines above the table: Account Number, Account Currency, the period ("... 01/04/2024 to 30/04/2024") and
# the Opening and Closing Balance. Table: S No. | Value Date | Transaction Date | Cheque Number | Transaction Remarks
# | Withdrawal Amount (INR) | Deposit Amount (INR) | Balance (INR); a USD account says (USD) instead.
# How profiles work: src/fin/extract/profiles.py and docs/CUSTOMISING.md.
kind = "bank"
bank = "ICICI"
currency = "INR"
header_rows = 1
date_format = "%d/%m/%Y"
period = '(?P<start>\d{2}/\d{2}/\d{4})\s+to\s+(?P<end>\d{2}/\d{2}/\d{4})'
unit = 1

[columns]
"Transaction Date" = "date"
"Cheque Number" = "reference"
"Transaction Remarks" = "remarks"
"Withdrawal Amount (INR)" = "debit"
"Withdrawal Amount (USD)" = "debit"
"Deposit Amount (INR)" = "credit"
"Deposit Amount (USD)" = "credit"
"Balance (INR)" = "balance"
"Balance (USD)" = "balance"

[header]
account = 'Account\s+(?:Number|No\.?)\s*:?\s*(?P<value>\d{6,})'
currency = 'Account\s+Currency\s*:?\s*(?P<value>[A-Z]{3})'
opening = 'Opening\s+Balance\s*:?\s*(?P<value>-?[\d,]+(?:\.\d{1,2})?)'
closing = 'Closing\s+Balance\s*:?\s*(?P<value>-?[\d,]+(?:\.\d{1,2})?)'

# Known masked names in these fields are replaced by their tokens.
[mask]
fields = ["remarks", "reference"]
