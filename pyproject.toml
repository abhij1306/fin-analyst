[project]
name = "fin-analyst"
version = "1.0.0"
description = "Local financial health analysis tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
    # 0.27: Docling (the optional add-on) needs typer < 0.28; the lock resolves both together.
    "typer==0.27.3",
]

[project.optional-dependencies]
# Opt-in PDF fallback (`./install.sh --docling`): reads the statement pages pdfplumber skips. Pulls
# PyTorch and Docling's models (about 1.4 GB). Not on Intel Macs: PyTorch has no macOS x86_64 wheels.
docling = [
    "docling==2.148.0 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "torch==2.15.0 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "torchvision==0.29.2 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]

[project.scripts]
fin = "fin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The fixture generator is the owner's script, kept as provided.
extend-exclude = ["tests/fixtures/sample-financials/generator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-ra"
markers = [
    "quarto: needs the real Quarto; run by the CI outputs job",
    "docling: needs the Docling add-on and its models; run by the CI docling job",
]

# Docling's models run on PyTorch. On Linux (CI, servers) take the CPU-only wheels: the default
# PyPI wheels pull several GB of CUDA libraries fin never uses. macOS wheels are CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.4",
]
