[project]
name = "fin-analyst"
version = "0.1.0"
description = "Local financial health analysis tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.10",
    "typer==0.28.0",
]

[project.scripts]
fin = "fin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The fixture generator is the owner's script, kept as provided.
extend-exclude = ["tests/fixtures/sample-financials/generator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-ra"

[dependency-groups]
dev = [
    "pdf-inspector==1.25.2",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.4",
]
