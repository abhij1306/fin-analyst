# SonarCloud automatic analysis settings.
# The .sql files are DuckDB, which Sonar has no analyser for: it reads them as Oracle PL/SQL and
# reports Oracle-only rules (VARCHAR2, size constraints). Leave them out of analysis.
sonar.exclusions=**/*.sql
sonar.cpd.exclusions=**/*.sql

# S8541 asks for `uv ... --no-build`. uv cannot install this project (fin itself, an editable
# package) with --no-build, and the only thing built is our own code, so the rule does not apply.
sonar.issue.ignore.multicriteria=uvgha,uvsh
sonar.issue.ignore.multicriteria.uvgha.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.uvgha.resourceKey=**/*
sonar.issue.ignore.multicriteria.uvsh.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.uvsh.resourceKey=**/*
