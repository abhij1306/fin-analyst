<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Answers with an error status (400) are shown too: they carry the error code. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":".*","swap":true}]}'>
  <link rel="preload" href="/static/vendor/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/vendor/basecoat.cdn.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/htmx-ext-sse.min.js" defer></script>
  <script src="/static/vendor/basecoat-all.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">fin</span>
    <label class="visually-hidden" for="company">Company</label>
    <select class="select" id="company" name="company"
            hx-get="{{ '/' if screen == 'home' else '/' ~ screen }}" hx-trigger="change"
            hx-target="body" hx-select="body" hx-swap="outerHTML" hx-push-url="true">
      {% for co in companies %}
      <option value="{{ co }}"{% if co == company %} selected{% endif %}>{{ co }}</option>
      {% else %}
      <option value="">No companies yet</option>
      {% endfor %}
    </select>
    {% include "_tabs.html" %}
    <span class="status"><span class="dot"></span>local only · fin {{ version }}</span>
  </header>
  <div class="split">
    <main id="screen" role="tabpanel" aria-labelledby="tab-{{ screen }}">{% block screen %}{% endblock %}</main>
    {% include "_chat.html" %}
  </div>
</body>
</html>
