# macOS checks (the product's only target): install.sh twice, fin doctor, a smoke ingest.
# The test suite runs on Linux in ci.yml.
# macOS runners can queue for a long time, so this runs after merges to main and on demand; PRs use ci.yml.
name: macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-and-test:
    # Fresh clone -> ./install.sh -> fin doctor passes; a second run changes nothing; one company loads.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Use a temporary data folder
        run: echo "FIN_DATA_DIR=$RUNNER_TEMP/fin-data" >> "$GITHUB_ENV"
      - name: First install
        run: ./install.sh
      # logs/ is left out of the comparison: every fin command appends its own run log there.
      - name: Snapshot state
        run: |
          eval "$(brew shellenv)"
          { (cd "$FIN_DATA_DIR" && find . -not -path './logs/*' | sort && shasum -a 256 config.toml); git status --porcelain; brew bundle check --file=Brewfile; } > "$RUNNER_TEMP/before.txt"
      - name: Second install
        run: ./install.sh
      - name: Second run changed nothing
        run: |
          eval "$(brew shellenv)"
          { (cd "$FIN_DATA_DIR" && find . -not -path './logs/*' | sort && shasum -a 256 config.toml); git status --porcelain; brew bundle check --file=Brewfile; } > "$RUNNER_TEMP/after.txt"
          diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
          grep -q "all Brewfile dependencies already installed" "$FIN_DATA_DIR/logs/install.log"
          grep -q "kept     config.toml (already present, not changed)" "$FIN_DATA_DIR/logs/install.log"
          grep -q "kept     shared/audit.duckdb" "$FIN_DATA_DIR/logs/install.log"
      - name: fin doctor passes
        run: |
          eval "$(brew shellenv)"
          uv run --frozen fin doctor
      - name: Smoke ingest and query
        run: |
          eval "$(brew shellenv)"
          uv run --frozen fin ingest kestrel tests/fixtures/sample-financials/clean/kestrel
          uv run --frozen fin sql kestrel --sql "SELECT count(*) AS facts FROM facts" | grep -q '"facts": 162'

  install-docling:
    # ./install.sh --docling adds the optional Docling add-on (and its models) and records it in
    # config.toml; a second plain run keeps it; the real-Docling tests pass; --no-docling removes it.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Use a temporary data folder
        run: echo "FIN_DATA_DIR=$RUNNER_TEMP/fin-data" >> "$GITHUB_ENV"
      - name: Install with Docling
        run: ./install.sh --docling
      - name: Recorded in config.toml, and fin doctor finds it with its models
        run: |
          eval "$(brew shellenv)"
          grep -q '^docling = true' "$FIN_DATA_DIR/config.toml"
          .venv/bin/fin doctor | grep -q "docling.*installed, models in"
      - name: A second plain install keeps it
        run: |
          ./install.sh
          .venv/bin/python -c "import docling"
      - name: Real-Docling tests
        run: |
          .venv/bin/pytest -m docling --durations=10
      - name: --no-docling removes it
        run: |
          ./install.sh --no-docling
          grep -q '^docling = false' "$FIN_DATA_DIR/config.toml"
          if .venv/bin/python -c "import docling"; then echo "docling still installed"; exit 1; fi
