# Every PR and main push: fast checks on Linux runners (they start in seconds).
# macOS checks live in macos.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: shellcheck install.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # The real-Quarto test runs in the outputs job, which has Quarto.
      - run: uv run pytest -m "not quarto" --durations=10

  # Ingest the synthetic companies once, then render Kestrel's report (Quarto) and build the dashboard.
  outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIN_DATA_DIR: ${{ github.workspace }}/.fin-data
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: 1.10.19
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboards/package-lock.json
      - run: uv sync --frozen
      - run: npm ci --prefix dashboards --no-audit --no-fund
      - name: Ingest the synthetic companies
        run: |
          uv run fin init
          for company in kestrel bluepeak tarang; do
            uv run fin ingest "$company" "tests/fixtures/sample-financials/clean/$company"
          done
      - name: Render Kestrel's report (with peers) from the sample narrative
        run: |
          mkdir -p "$FIN_DATA_DIR/reports/kestrel/standalone"
          cp tests/fixtures/report/kestrel_narrative.md "$FIN_DATA_DIR/reports/kestrel/standalone/narrative.md"
          uv run fin report kestrel --render --peers bluepeak,tarang
      - name: All three formats exist, with every section
        run: |
          cd "$FIN_DATA_DIR/reports/kestrel/standalone"
          for file in health.html health.docx health.pdf; do
            test -s "$file" || { echo "missing $file"; exit 1; }
          done
          for section in Summary Profitability Solvency "Peer comparison" Findings "Data coverage" "standard statements" "metric definitions"; do
            grep -q "$section" health.html || { echo "section $section missing"; exit 1; }
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-report
          path: .fin-data/reports/kestrel/standalone/health.*
      - run: uv run fin dashboard --build
      - name: The built site has every page and the companies
        # Pages load their query results from api/prerendered_queries (Arrow files), where the
        # company names are stored.
        run: |
          build="$FIN_DATA_DIR/dashboard/build"
          for page in index.html company/index.html compare/index.html quality/index.html; do
            test -f "$build/$page" || { echo "$page missing from the build"; exit 1; }
          done
          for company in kestrel bluepeak tarang; do
            grep -rq "$company" "$build/api/prerendered_queries" || { echo "$company missing from the built data"; exit 1; }
          done
          # Metric categories and statement coverage reach the pages too.
          for text in profitability efficiency balance_sheet; do
            grep -rq "$text" "$build/api/prerendered_queries" || { echo "'$text' missing from the built data"; exit 1; }
          done
      # Only the test that needs the real Quarto; the test job ran the rest (-rs lists a skip).
      - run: uv run pytest -m quarto -rs
