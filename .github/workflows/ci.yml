# Every PR and main push: fast checks on Linux runners (they start in seconds).
# macOS checks live in macos.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: shellcheck install.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run pytest --durations=10

  # Phase 9: render the synthetic company's health report with Quarto (HTML, docx, Typst PDF).
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: 1.10.19
      - run: uv sync --frozen
      - run: echo "FIN_DATA_DIR=$RUNNER_TEMP/FinAnalysis" >> "$GITHUB_ENV"
      - name: Ingest Kestrel and render its report from the sample narrative
        run: |
          uv run fin init
          uv run fin ingest kestrel tests/fixtures/sample-financials/clean/kestrel
          mkdir -p "$FIN_DATA_DIR/reports/kestrel/standalone"
          cp tests/fixtures/report/kestrel_narrative.md "$FIN_DATA_DIR/reports/kestrel/standalone/narrative.md"
          uv run fin report kestrel --render
      - name: All three formats exist
        run: |
          cd "$FIN_DATA_DIR/reports/kestrel/standalone"
          for file in health.html health.docx health.pdf; do
            test -s "$file" || { echo "missing $file"; exit 1; }
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-report
          path: ${{ runner.temp }}/FinAnalysis/reports/kestrel/standalone/health.*
      # With Quarto on PATH the real-render test runs too (-rs lists any skip).
      - run: uv run pytest tests/integration/test_report.py tests/unit/test_report_lint.py -rs

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIN_DATA_DIR: ${{ github.workspace }}/.fin-data
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboards/package-lock.json
      - run: uv sync --frozen
      - run: npm ci --prefix dashboards --no-audit --no-fund
      - run: uv run fin init
      - name: Ingest the clean synthetic companies
        run: |
          for company in kestrel bluepeak tarang; do
            uv run fin ingest "$company" "tests/fixtures/sample-financials/clean/$company"
          done
      - run: uv run fin dashboard --build
      - name: The built site has every page and the companies
        # Pages load their query results from api/prerendered_queries (Arrow files), where the
        # company names are stored.
        run: |
          build="$FIN_DATA_DIR/dashboard/build"
          for page in index.html company/index.html compare/index.html quality/index.html; do
            test -f "$build/$page" || { echo "$page missing from the build"; exit 1; }
          done
          for company in kestrel bluepeak tarang; do
            grep -rq "$company" "$build/api/prerendered_queries" || { echo "$company missing from the built data"; exit 1; }
          done
