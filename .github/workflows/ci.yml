# Every PR and main push: fast checks on Linux runners (they start in seconds).
# macOS checks live in macos.yml; the Linux install check (install-linux) runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # runs the store-durations job too

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: shellcheck install.sh
      - run: node tools/check_file_size.mjs

  # The suite is split into 3 groups of about equal time (pytest-split, from .test_durations), each
  # on its own runner with one pytest worker per core. Refresh the timings when they drift:
  # run the CI workflow by hand (`gh workflow run CI --ref <branch>`) and commit the .test_durations
  # its store-durations job uploads. Tests missing from the file count as the average test.
  test:
    name: test (${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # The real-Quarto test runs in the outputs job, which has Quarto; the real-engine tests
      # (marked docling or liteparse) skip here, without the add-ons, and run in the pdf-addon jobs.
      - run: >-
          uv run --frozen pytest -m "not quarto" -n auto --durations=10
          --splits 3 --group ${{ matrix.group }} --splitting-algorithm least_duration

  # On demand only: the whole suite on one runner, storing each test's time in .test_durations
  # (uploaded as an artifact, to commit) for the test job's split.
  store-durations:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m "not quarto" -n auto --store-durations --clean-durations
      - uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true

  # The optional web UI (`fin ui`): its server tests (local-only protections, pages), which need the `ui`
  # extra. No frontend build: pages are server-rendered HTML with vendored htmx and Basecoat.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ui
      - run: uv sync --frozen --extra ui # NOSONAR: uv refuses --no-build for the editable project install
      - run: .venv/bin/pytest tests/unit/test_ui_server.py tests/unit/test_ui_cli.py --durations=5

  # The optional PDF add-ons, one job each (uv sync --extra <name>): the tests that run the real
  # engine on synthetic PDFs (Docling: CPU-only PyTorch on Linux, pyproject.toml; models cached
  # between runs). LlamaParse is never called from CI: its job checks the recorded-shape fixture
  # against the SDK, and its live test skips without LLAMA_CLOUD_API_KEY.
  pdf-addon:
    name: pdf-addon (${{ matrix.parser }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        parser: [docling, liteparse, llamaparse]
    env:
      LITEPARSE_MODEL_DIR: /home/runner/.cache/liteparse-models
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.parser }}
      - run: uv sync --frozen --extra ${{ matrix.parser }}
      - id: docling-models
        if: matrix.parser == 'docling'
        uses: actions/cache@v4
        with:
          path: ~/.cache/docling/models
          key: docling-models-${{ hashFiles('uv.lock') }}
      - if: matrix.parser == 'docling' && steps.docling-models.outputs.cache-hit != 'true'
        run: .venv/bin/docling-tools models download layout tableformer rapidocr
      - id: liteparse-models
        if: matrix.parser == 'liteparse'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/liteparse-models
          key: liteparse-models-${{ hashFiles('uv.lock') }}
      - if: matrix.parser == 'liteparse' && steps.liteparse-models.outputs.cache-hit != 'true'
        run: .venv/bin/lit models pull ocria-nano@1.0.0
      - if: matrix.parser != 'llamaparse'
        run: .venv/bin/pytest -m ${{ matrix.parser }} --durations=10
      - if: matrix.parser == 'llamaparse'
        run: .venv/bin/pytest tests/unit/test_llamaparse_run.py -rs

  # Linux install (Debian/Ubuntu): a fresh ubuntu:24.04 container, as root with no sudo, runs ./install.sh
  # twice; the second run changes nothing; fin doctor passes; one company loads. (The macOS equivalent is
  # macos.yml.)
  install-linux:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Tools the checkout and the state comparison need (install.sh installs the rest)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git
      - uses: actions/checkout@v5
      - name: Use a temporary data folder
        run: echo "FIN_DATA_DIR=$RUNNER_TEMP/fin-data" >> "$GITHUB_ENV"
      - name: First install
        run: ./install.sh
      # logs/ is left out of the comparison: every fin command appends its own run log there.
      - name: Snapshot state
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          { (cd "$FIN_DATA_DIR" && find . -not -path './logs/*' | sort && sha256sum config.toml); git status --porcelain; command -v uv node npm quarto pdftoppm; } > "$RUNNER_TEMP/before.txt"
      - name: Second install
        run: ./install.sh
      - name: Second run changed nothing
        run: |
          { (cd "$FIN_DATA_DIR" && find . -not -path './logs/*' | sort && sha256sum config.toml); git status --porcelain; command -v uv node npm quarto pdftoppm; } > "$RUNNER_TEMP/after.txt"
          diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
          grep -q "all system dependencies already installed" "$FIN_DATA_DIR/logs/install.log"
          grep -q "kept     config.toml (already present, not changed)" "$FIN_DATA_DIR/logs/install.log"
          grep -q "kept     shared/audit.duckdb" "$FIN_DATA_DIR/logs/install.log"
      - name: fin doctor passes
        run: .venv/bin/fin doctor
      - name: Smoke ingest and query
        run: |
          .venv/bin/fin ingest kestrel tests/fixtures/sample-financials/clean/kestrel
          .venv/bin/fin sql kestrel --sql "SELECT count(*) AS facts FROM facts" | grep -q '"facts": 162'

  # Ingest the synthetic companies once, then render Kestrel's report (Quarto) and build the dashboard;
  # the quarto-marked tests render the health report and the diligence report for real.
  outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIN_DATA_DIR: ${{ github.workspace }}/.fin-data
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.10.19
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboards/package-lock.json
      - run: uv sync --frozen
      - run: npm ci --prefix dashboards --no-audit --no-fund --ignore-scripts
      - name: Ingest the synthetic companies
        run: |
          uv run --frozen fin init
          for company in kestrel bluepeak tarang; do
            uv run --frozen fin ingest "$company" "tests/fixtures/sample-financials/clean/$company"
          done
      - name: Render Kestrel's report (with peers) from the sample narrative
        run: |
          mkdir -p "$FIN_DATA_DIR/reports/kestrel/standalone"
          cp tests/fixtures/report/kestrel_narrative.md "$FIN_DATA_DIR/reports/kestrel/standalone/narrative.md"
          uv run --frozen fin report kestrel --render --peers bluepeak,tarang
      - name: All three formats exist, with every section
        run: |
          cd "$FIN_DATA_DIR/reports/kestrel/standalone"
          for file in health.html health.docx health.pdf; do
            test -s "$file" || { echo "missing $file"; exit 1; }
          done
          for section in Summary Profitability Solvency "Peer comparison" Findings "Data coverage" "standard statements" "metric definitions"; do
            grep -q "$section" health.html || { echo "section $section missing"; exit 1; }
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-report
          path: .fin-data/reports/kestrel/standalone/health.*
      - run: uv run --frozen fin dashboard --build
      - name: The built site has every page and the companies
        # Pages load their query results from api/prerendered_queries (Arrow files), where the
        # company names are stored.
        run: |
          build="$FIN_DATA_DIR/dashboard/build"
          for page in index.html company/index.html compare/index.html quality/index.html; do
            test -f "$build/$page" || { echo "$page missing from the build"; exit 1; }
          done
          for company in kestrel bluepeak tarang; do
            grep -rq "$company" "$build/api/prerendered_queries" || { echo "$company missing from the built data"; exit 1; }
          done
          # Metric categories and statement coverage reach the pages too.
          for text in profitability efficiency balance_sheet; do
            grep -rq "$text" "$build/api/prerendered_queries" || { echo "'$text' missing from the built data"; exit 1; }
          done
      # Only the tests that need the real Quarto (the health report and the diligence report); the
      # test job ran the rest (-rs lists a skip).
      - run: uv run --frozen pytest -m quarto -rs
